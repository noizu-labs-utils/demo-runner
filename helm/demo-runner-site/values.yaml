# demo-runner.therobotlives.com — app chart (deployment+service+ingress).
# Deployed into the `apps` namespace by the ArgoCD application (destination),
# like the fleet siblings. Image tags are bumped by CI (bump-chart job),
# never by hand.
# 〚📁:9ff078f7-c6ee-5f00-bb3e-4a4c27b5fb65〛 Chart values :: demo-runner.therobotlives.com deploy — CI-owned sha image tag, TLS, cloudflare-only ingress.

fullnameOverride: demo-runner-site
domain: demo-runner.therobotlives.com
replicas: 1

# Bootstrap tag until CI's first bump-chart owns sha-<7> on main.
image: ops.noizu.com/demo-runner.therobotlives.com/web:sha-0acd0e8

port: 8170
imagePullSecrets:
  - name: ops-registry-secret

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

tls:
  enabled: true
  # Reuse the zone origin CA already serving this host (SAN *.therobotlives.com).
  # Do not mint a second Infisical-owned secret — 526 while it syncs.
  secretName: therobotlives-com-tls
  infisical:
    enabled: false

ingress:
  enabled: true
  className: nginx
  cloudflareOnly: true
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
